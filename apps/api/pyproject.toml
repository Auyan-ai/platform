[tool.poetry]
name = "auyan-api"
version = "0.1.0"
description = "Auyan API — FastAPI + LangGraph agent for AI-native CX support"
authors = ["Auyan <eng@auyan.ai>"]
readme = "../../README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }

# Settings / validation
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# Agent stack
langgraph = "^0.2.50"
langchain-core = "^0.3.0"
anthropic = "^0.40.0"
openai = "^1.55.0"

# Database (Postgres directo para pgvector + GUC por request)
asyncpg = "^0.30.0"
pgvector = "^0.3.5"

# Observability
langsmith = "^0.8.4"
langfuse = "^2.55.0"
structlog = "^24.4.0"

# Reliability
tenacity = "^9.0.0"

# HTTP client
httpx = "^0.27.0"
python-dotenv = "^1.0.0"

# Auth
pyjwt = {extras = ["crypto"], version = "^2.10.0"}
cryptography = ">=44.0"
cachetools = "^5.5.0"
tzdata = "^2026.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
respx = "^0.21.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
types-cachetools = "^5.5.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ----------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts permitidos en tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "E501", "RUF012"]  # secrets, subprocess en tests, líneas largas
"evals/**" = ["E501"]  # strings de mensajes de aserción inevitablemente largos
"aops/canonical.py" = ["E501"]  # módulo de datos: guardrails/bodies en español, strings largos inevitables
"scripts/**" = ["E501", "S603"]  # scripts de CLI y utilitarios
"integrations/pricing.py" = ["RUF003"]  # en-dash y × en comentarios técnicos son intencionales
"services/email_templates/**" = ["E501"]  # HTML en strings: líneas largas inevitables
"simulator/scenarios/**" = ["E501"]  # descriptions y fixtures de scenarios: strings inevitablemente largos

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "langfuse.*", "langsmith.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../.."]              # raíz del repo, para que `apps.api.*` sea importable
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
