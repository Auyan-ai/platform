    MaxMsgs = 2
    MaxApprovals = 2
    MaxClicks = 1
    MaxFaults = 1
    LeaseCanExpire = FALSE
    CancelRefusedIn = {"cancelled"}
    RecoverWhileRunning = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    MessagesTaken
    ExecutionSettles
    ApprovalEventuallyFinal
