\* Seguridad. 2 mensajes del cliente, 2 workers, 2 operadores con un clic cada uno, 2 recuperaciones,
\* 1 pedido, hasta 2 aprobaciones y 1 fallo (caída, respuesta perdida o lectura fallida).
SPECIFICATION Spec
CONSTANTS
    Humans = {h1, h2}
    Workers = {w1, w2}
    Recoverers = {r1, r2}
    Skills = {"cancel", "address", "refund"}
    MaxMsgs = 2
    MaxApprovals = 2
    MaxClicks = 1
    MaxFaults = 1
    LeaseCanExpire = FALSE
    CancelRefusedIn = {"cancelled"}
    RecoverWhileRunning = FALSE
SYMMETRY Perms
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OneTurnAtATime
    ExecAtMostOnce
    OneExecPerOrder
    NoExecOnClosedOrder
    RejectedNeverExecuted
    ExecutedNeverPending
    OneOutcomePerApproval
    OutcomeIsTruthful
    NoWaitingAfterOutcome
    NoOrphanEscalation
    NoGateEscalationForApproved
    LiveApprovalHasEscalation
    ExecutedIsApproved
