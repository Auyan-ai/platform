\* Seguridad. 2 mensajes del cliente, 2 workers, 2 operadores con un clic cada uno,
\* 1 pedido, hasta 2 aprobaciones y 1 fallo (caída de un proceso).
SPECIFICATION Spec
CONSTANTS
    Humans = {h1, h2}
    Workers = {w1, w2}
    NoOne = NoOne
    Skills = {"cancel", "address", "refund"}
    MaxMsgs = 2
    MaxApprovals = 2
    MaxClicks = 1
    MaxFaults = 1
    LeaseCanExpire = FALSE
    CancelRefusedIn = {"cancelled"}
SYMMETRY Perms
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ExecAtMostOnce
    NoExecOnClosedOrder
    RejectedNeverExecuted
    OneOutcomePerApproval
    OutcomeIsTruthful
    NoWaitingAfterOutcome
    NoOrphanEscalation
    ExecutedIsApproved
